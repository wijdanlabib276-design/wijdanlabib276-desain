<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7a5f"/>
      <stop offset="100%" stop-color="#0a5c47"/>
    </linearGradient>
    <linearGradient id="gclr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a826"/>
      <stop offset="100%" stop-color="#d18f1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="20" fill="url(#bg)"/>

  <!-- Mosque dome -->
  <g transform="translate(300,60)">
    <path d="M-60,120 L-60,50 Q0,-40 60,50 L60,120 Z" fill="#ffffff" opacity="0.15"/>
    <rect x="-60" y="120" width="120" height="15" rx="4" fill="#ffffff" opacity="0.2"/>
    <path d="M0,-50 L0,-70" stroke="#f4a826" stroke-width="4"/>
    <circle cx="0" cy="-72" r="6" fill="#f4a826"/>
  </g>

  <!-- Students (santri) group -->
  <g transform="translate(300,290)">
    <!-- Saintri 1 -->
    <g transform="translate(-90,0)">
      <circle cx="0" cy="-55" r="22" fill="#f5c9a0"/>
      <rect x="-16" y="-35" width="32" height="55" rx="8" fill="#ffffff"/>
      <rect x="-16" y="-35" width="32" height="12" rx="4" fill="#0e7a5f"/>
      <rect x="-20" y="-28" width="40" height="6" rx="3" fill="#f4a826"/>
      <circle cx="0" cy="-55" r="24" fill="#1a1a2e" opacity="0.9"/>
      <circle cx="0" cy="-55" r="24" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <!-- Saintri 2 -->
    <g transform="translate(0,-8)">
      <circle cx="0" cy="-55" r="22" fill="#f5c9a0"/>
      <rect x="-16" y="-35" width="32" height="55" rx="8" fill="#ffffff"/>
      <rect x="-16" y="-35" width="32" height="12" rx="4" fill="#0e7a5f"/>
      <rect x="-20" y="-28" width="40" height="6" rx="3" fill="#f4a826"/>
      <circle cx="0" cy="-55" r="24" fill="#1a1a2e" opacity="0.9"/>
      <circle cx="0" cy="-55" r="24" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <!-- Saintri 3 -->
    <g transform="translate(90,0)">
      <circle cx="0" cy="-55" r="22" fill="#f5c9a0"/>
      <rect x="-16" y="-35" width="32" height="55" rx="8" fill="#ffffff"/>
      <rect x="-16" y="-35" width="32" height="12" rx="4" fill="#0e7a5f"/>
      <rect x="-20" y="-28" width="40" height="6" rx="3" fill="#f4a826"/>
      <circle cx="0" cy="-55" r="24" fill="#1a1a2e" opacity="0.9"/>
      <circle cx="0" cy="-55" r="24" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Books / open book -->
  <g transform="translate(300,285)">
    <path d="M-40,0 Q0,-14 40,0 L40,20 Q0,6 -40,20 Z" fill="url(#gclr)"/>
    <path d="M0,3 L0,16" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="60" cy="60" r="40" fill="#ffffff" opacity="0.06"/>
  <circle cx="540" cy="340" r="60" fill="#ffffff" opacity="0.06"/>
  <circle cx="520" cy="80" r="20" fill="#f4a826" opacity="0.3"/>
</svg>
