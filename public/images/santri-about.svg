<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f4ef"/>
      <stop offset="100%" stop-color="#c8e6d9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7a5f"/>
      <stop offset="100%" stop-color="#0a5c47"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#bg2)"/>

  <!-- Desk -->
  <rect x="120" y="280" width="360" height="16" rx="6" fill="#8b5e3c"/>
  <rect x="140" y="296" width="12" height="60" fill="#8b5e3c"/>
  <rect x="448" y="296" width="12" height="60" fill="#8b5e3c"/>

  <!-- Open books on desk -->
  <g transform="translate(200,275)">
    <path d="M-30,0 Q0,-12 30,0 L30,14 Q0,2 -30,14 Z" fill="#ffffff" stroke="#0e7a5f" stroke-width="2"/>
    <path d="M0,1 L0,12" stroke="#0e7a5f" stroke-width="1.5"/>
  </g>
  <g transform="translate(330,278)">
    <path d="M-25,0 Q0,-10 25,0 L25,12 Q0,2 -25,12 Z" fill="#f4a826"/>
  </g>

  <!-- Saintri studying (sitting) -->
  <g transform="translate(300,240)">
    <!-- Body -->
    <rect x="-20" y="-5" width="40" height="50" rx="10" fill="#ffffff" stroke="#0e7a5f" stroke-width="2"/>
    <rect x="-20" y="-5" width="40" height="14" rx="6" fill="#0e7a5f"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="18" fill="#f5c9a0"/>
    <circle cx="0" cy="-25" r="20" fill="#1a1a2e" opacity="0.9"/>
    <circle cx="0" cy="-25" r="20" fill="none" stroke="#0e7a5f" stroke-width="2"/>
    <!-- Arms holding book -->
    <path d="M-18,-2 Q-30,10 -20,18" stroke="#f5c9a0" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M18,-2 Q30,10 20,18" stroke="#f5c9a0" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pencil -->
  <g transform="translate(280,300) rotate(30)">
    <rect x="-4" y="-20" width="8" height="40" rx="2" fill="#f4a826"/>
    <polygon points="-4,-20 4,-20 0,-32" fill="#f5c9a0"/>
    <rect x="-4" y="20" width="8" height="6" rx="2" fill="#e74c3c"/>
  </g>

  <!-- Floating stars / sparkles -->
  <circle cx="90" cy="90" r="6" fill="#f4a826"/>
  <circle cx="150" cy="120" r="3" fill="#0e7a5f"/>
  <circle cx="500" cy="100" r="5" fill="#f4a826"/>
  <circle cx="450" cy="70" r="3" fill="#0e7a5f"/>
</svg>
